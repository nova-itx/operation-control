{let _cw=true;Object.defineProperty(S,'canWrite',{get(){return _cw&&!telaSoLeitura()},set(v){_cw=!!v},enumerable:true});}

/* ---------- formatação ---------- */
const nf2=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf0=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0});
const brl=n=>(n==null||isNaN(n))?'':(n<0?'−':'')+'R$ '+nf2.format(Math.abs(n));
const num2=n=>(n==null||isNaN(n))?'':(n<0?'−':'')+nf2.format(Math.abs(n));
const k0=n=>{if(n==null||isNaN(n))return'';const a=Math.abs(n);const s=a>=1e6?nf2.format(a/1e6)+' mi':a>=1e3?nf0.format(a/1e3)+' mil':nf0.format(a);return(n<0?'−':'')+s};
const pct=(n,d)=>{if(d==null)d=sis().pctCasas;return pctF(n,d)};
const pctF=(n,d)=>(n==null||isNaN(n)||!isFinite(n))?'–':(n<0?'−':'')+Math.abs(n*100).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function parseBR(s){s=String(s??'').trim().replace(/[R$\s%]/g,'').replace('−','-');if(s==='')return null;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');const n=parseFloat(s);return isNaN(n)?null:n}
const ym=(y,i)=>y+'-'+String(i+1).padStart(2,'0');

const dis=(extra)=>(!S.canWrite||extra)?' disabled':'';
const slug=s=>String(s||'').normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'x';

/* ---------- dados derivados ---------- */
const listas=()=>Object.assign({},DEF_LISTAS,S.listas||{});
function matriz(){const m={};for(const[k] of PERFIS)m[k]=Object.assign({},DEF_MATRIZ[k]||{},(S.matriz||{})[k]||{});return m}
function meuPerfilReal(){if(!S.me)return null;if(S.me.isOwner)return'admin';const a=S.me.id&&S.acessos.find(x=>x._id===S.me.id);return a&&PERFIL_NOME[a.perfil]?a.perfil:null}
function meuPerfil(){const r=meuPerfilReal();return r==='admin'&&UI.verComo&&PERFIL_NOME[UI.verComo]?UI.verComo:r}
function setVerComo(v){const real=meuPerfilReal();if(real!=='admin')return;v=v&&v!=='admin'&&PERFIL_NOME[v]?v:'';if(v&&!UI.verComo)S._cwReal=S.canWrite;UI.verComo=v;S.canWrite=v?false:(S._cwReal!=null?S._cwReal:S.canWrite);render();window.scrollTo({top:0})}
function P(k){const pf=meuPerfil();if(!pf)return false;if(pf==='admin')return true;const tabEd=t=>menuNivel(pf,'tab:'+t)==='editar';const subEd=(t,x)=>tabEd(t)&&menuNivel(pf,'sub:'+t+'.'+x)==='editar';
  switch(k){case'ver_valores':return true;case'editar_mes':case'fechar_mes':return tabEd('mes');case'editar_prestadores':case'editar_salarios':return subEd('cadastro','prestadores');case'registrar_pagamentos':return subEd('cadastro','prestadores')||tabEd('mes');case'editar_vagas':return subEd('cadastro','vagas');case'editar_clientes':return subEd('cadastro','clientes');case'editar_centros':return tabEd('cadastro');case'editar_config':return tabEd('config');case'editar_fiscal':return tabEd('fiscal');case'ver_auditoria':return menuNivel(pf,'tab:auditoria')!=='oculto';default:return false}}
const disP=(k,extra)=>(!S.canWrite||!P(k)||extra)?' disabled':'';
const podeAcessos=()=>P('gerenciar_acessos')&&!!(S.me&&S.me.canEdit);
const tabsVisiveis=()=>TABS.filter(([k])=>tabOk(k)).filter(([k])=>k==='relatorios'?(P('gerenciar_relatorios')||REL.some(r=>relPermitido(r))):(!TAB_PERM[k]||P(TAB_PERM[k])));
function nomeDe(id){if(!id)return null;if(!(id in S.names)&&S.user){S.names[id]=null;S.user.profiles([id]).then(r=>{Object.assign(S.names,r);clearTimeout(nomeDe._t);nomeDe._t=setTimeout(render,30)})}return S.names[id]||null}

function sis(){const x=Object.assign({},DEF_SIS,S.sis||{});x.arred=Object.assign({},DEF_SIS.arred,(S.sis||{}).arred||{});return x}
function arredondar(v,ar){if(!ar||ar.tipo==='nenhum'||v==null||isNaN(v))return v;const f=Math.pow(10,ar.casas==null?2:+ar.casas);const sg=v<0?-1:1;const x=Math.abs(v)*f;let r;
  if(ar.tipo==='cima')r=sg>0?Math.ceil(x-1e-9):Math.floor(x+1e-9);else if(ar.tipo==='baixo')r=sg>0?Math.floor(x+1e-9):Math.ceil(x-1e-9);
  else if(ar.tipo==='bancario'){const fl=Math.floor(x+1e-9);const d=x-fl;r=Math.abs(d-0.5)<1e-7?(fl%2===0?fl:fl+1):Math.round(x)}else r=Math.round(x+1e-9);return sg*r/f}

function ccAplica(o,p){o.naoAlocado=true;const l=ccSplitP(p);if(l.length){o.centroCusto=l[0].cc;if(l.length>1)o.centros=l.map(x=>({cc:x.cc,pct:x.pct}));else delete o.centros}else{delete o.centroCusto;delete o.centros}if(p.contratoPagador){o.contratoPagador=p.contratoPagador;delete o.vagaPagadora}else{delete o.contratoPagador;if(p.vagaPagadora)o.vagaPagadora=p.vagaPagadora;else delete o.vagaPagadora}}

function naItxNoMes(p,k){const e=String(p.entrada||'').slice(0,7),sd=String(p.saida||'').slice(0,7);if(e&&e>k)return false;if(sd&&sd<k)return false;if(p.ativo===false&&!sd)return false;return true}
function periodoNoMes(p,cid,k){if(!naItxNoMes(p,k))return null;const h=cliHist(p).filter(x=>x.cliente===cid);for(let i=h.length-1;i>=0;i--){const x=h[i];const e=String(x.entrada||p.entrada||'').slice(0,7),sd=String(x.saida||'').slice(0,7);if((!e||e<=k)&&(!sd||sd>=k))return x}return null}

  </div>`;

}

function mesNotaPanel(k){const d=S.mesnotas.find(x=>x._id===k)||{};return`<section class="panel"><div class="ph"><h2>Anotações do mês · ${ymLabel(k)}</h2><span class="sub">uma anotação para o mês, valendo para todos os clientes: entradas, saídas, aumentos, dias proporcionais</span></div><div class="pb"><textarea class="cell" id="m-notas" style="min-height:120px" data-act="mnota" data-key="${k}" data-type="text" aria-label="Anotações do mês"${disP('editar_mes')}>${esc(d.texto||'')}</textarea><p class="small muted" style="margin:6px 0 0">Gravada ao sair do campo.</p></div></section>`}

function vMesCli(cid){const k=UI.mes;const cli=cliById(cid);const doc=mesDoc(cid,k);const meta=metaDe(cid);let h='';

    ${!g.so&&g.pend?`<div class="alert warn"><span class="ic">!</span><div><p>${g.pend} ${g.pend===1?'nota ainda não foi marcada como emitida':'notas ainda não foram marcadas como emitidas'} no Espelho das notas e ${g.pend===1?'está':'estão'} no total. Para gerar a guia só com o que foi emitido, escolha "Só as emitidas".</p></div></div>`:''}
    ${g.semMes?`<div class="alert warn"><span class="ic">!</span><div><p>${g.semMes} ${g.semMes===1?'nota usa':'notas usam'} a receita do cadastro porque ${ymLabel(ym)} ainda não foi lançado para ${g.semMes===1?'esse cliente':'esses clientes'} no Lançamento Mensal.</p></div></div>`:''}
  </div></section>`;
  h+=`<section class="panel"><div class="ph"><h2>Notas de ${ymLabel(ym)}</h2><span class="sub">${g.so?'só as marcadas como emitidas':'todas as notas do mês, emitidas e pendentes'}</span></div><div class="tw"><table class="t"><thead><tr><th>Cliente</th><th>Nota</th><th>Situação</th><th class="num">Valor do serviço</th><th class="num">Dedutível</th><th class="num">Base de cálculo</th><th class="num">ISS</th></tr></thead><tbody>${g.use.map(r=>`<tr><td>${esc(r.c.nome)}</td><td><b>${esc(r.u.nome)}</b></td><td>${r.em?`<span class="pill good">emitida${r.num?' nº '+esc(r.num):''}</span>`:'<span class="pill warn">pendente</span>'}</td><td class="num">${nf2.format(r.k.V)}</td><td class="num">${nf2.format(r.k.ded)}</td><td class="num">${nf2.format(r.k.base)}</td><td class="num"><b>${nf2.format(r.k.iss)}</b></td></tr>`).join('')||`<tr><td colspan="7" class="empty">${g.so&&g.rows.length?'Nenhuma nota marcada como emitida neste mês. Marque no Espelho das notas.':'Nenhuma nota com valor neste mês.'}</td></tr>`}${g.use.length?`<tr class="foot"><td colspan="3">Total da guia</td><td class="num">${nf2.format(g.V)}</td><td></td><td class="num">${nf2.format(g.base)}</td><td class="num">${nf2.format(g.iss)}</td></tr>`:''}</tbody></table></div>
  <div class="pb"><p class="note" style="max-width:100ch">O ISS de cada nota é (valor do serviço − dedutível) × alíquota, arredondado na nota, e a guia é a soma. A alíquota e o valor dedutível ficam em Informações da nota. ${esc(F.issRetido||'')}. Município: ${esc(F.municipio||'')}. Gere a guia no portal da prefeitura e confira o valor e o vencimento por lá.</p></div></section>`;

function fisBarra(){const d=fisDif();const E=S.canWrite&&P('editar_fiscal');return`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${d.length?`<span class="pill warn" title="${esc(d.map(fisNomeCampo).join(', '))}">${d.length} ${d.length===1?'campo alterado':'campos alterados'}, não salvo</span><span class="small muted">${esc(d.slice(0,4).map(fisNomeCampo).join(', '))}${d.length>4?'…':''}</span>`:'<span class="small muted">Tudo salvo.</span>'}<span class="spacer"></span><button class="btn small ghost" data-click="fisDesc"${d.length&&E?'':' disabled'}>Descartar</button><button class="btn small primary" data-click="fisSalvar"${d.length&&E?'':' disabled'}>Salvar alterações</button></div>`}
function vFisDados(){const c=fisCfg();const E=S.canWrite&&P('editar_fiscal')?'':' disabled';let h='';
  const inp=(path,val,type,attrs)=>`<input class="cell${type==='text'?' txt':''}" id="fis-${path.replace(/\./g,'-')}" data-act="fis" data-f="${path}" data-type="${type}" value="${esc(val)}"${attrs||''}${E}>`;
  h+=`<section class="panel"><div class="ph"><h2>Informações da nota fiscal</h2><span class="sub">Portal NFS-e de Santana de Parnaíba</span></div><div class="pb" style="display:flex;flex-direction:column;gap:14px"><p class="note" style="max-width:110ch">Aqui ficam as informações que se repetem em todas as notas, as alíquotas usadas nos cálculos, os dados de cada cliente (tomador) e como cada vaga aparece no texto da nota. O espelho de cada mês é montado a partir daqui. Nada é gravado até você clicar em Salvar alterações.</p>${fisBarra()}</div></section>`;
  h+=`<section class="panel"><div class="ph"><h2>1. Informações fixas</h2><span class="sub">iguais em todas as notas</span></div><div class="pb" style="display:flex;flex-direction:column;gap:16px">${FIS_FIXOS.map(([g,fs])=>`<div><div class="small muted" style="font-weight:600;margin-bottom:6px">${g}</div><div class="fisgrid">${fs.map(([k,l])=>`<div class="field${['textoServico','nbs','outrasInfo','dadosPagamento','classTrib','cnae','issRetido'].includes(k)?' wide':''}"><label for="fis-fixos-${k}">${l}</label>${k==='horasPadrao'?inp('fixos.'+k,c.fixos[k],'num',' inputmode="numeric" style="width:100px;min-width:100px"'):inp('fixos.'+k,c.fixos[k]??'','text')}</div>`).join('')}</div></div>`).join('')}</div></section>`;
  h+=`<section class="panel"><div class="ph"><h2>2. Alíquotas</h2><span class="sub">usadas para calcular os valores de cada nota</span></div><div class="pb"><div class="fisgrid">${FIS_ALIQ.map(([k,l,t])=>`<div class="field"><label for="fis-aliq-${k}">${l}${t==='money'?'':' (%)'}</label>${t==='money'?inp('aliq.'+k,inVal(c.aliq[k]),'money',' inputmode="decimal" style="width:120px;min-width:120px"'):inp('aliq.'+k,inPct4(c.aliq[k]),'pct',' inputmode="decimal" style="width:120px;min-width:120px"')}</div>`).join('')}</div><p class="note" style="margin-top:10px;max-width:110ch">Como cada valor é calculado sobre o valor do serviço (V): ISS = (V − dedutível) × ISS. PIS e COFINS = V × alíquota (apuração própria, não descontam do líquido). Contribuições sociais retidas, INSS e IR = V × alíquota. Valor líquido = V − contribuições retidas − INSS − IR − outras retenções. Base IBS/CBS = V − PIS − COFINS − ISS. CBS e IBS = base IBS/CBS × alíquota.</p></div></section>`;
  const clis=S.clientes.filter(x=>x.ativo!==false).sort((a,b)=>String(a.nome).localeCompare(b.nome,'pt-BR'));
  h+=`<section class="panel"><div class="ph"><h2>3. Tomador por cliente</h2><span class="sub">muda conforme o cliente</span></div><div class="pb"><p class="note" style="max-width:110ch">CNPJ, razão social, endereço, inscrição municipal, município de incidência e apelido no portal ficam no cadastro de cada cliente, em Controle Operacional > Clientes. ${clis.map(cl=>{const t=fisTom(cl);return`<br><b>${esc(cl.nome)}:</b> ${t.cnpj?esc(t.razao||'')+' · CNPJ '+esc(t.cnpj):'<span style="color:var(--warn)">sem dados fiscais</span>'}`}).join('')}</p></div></section>`;
  const vs=S.vagas.filter(v=>v.ativa!==false&&clis.some(x=>x._id===v.cliente)).sort((a,b)=>String(a.nome).localeCompare(b.nome,'pt-BR',{numeric:true}));
  h+=`<section class="panel"><div class="ph"><h2>4. Vagas na discriminação</h2><span class="sub">como cada vaga ativa aparece no texto da nota</span></div><div class="tw"><table class="t"><thead><tr><th>Cliente</th><th>Vaga</th><th>Identificação na nota</th><th class="num">Horas no mês</th><th>Prévia da linha</th></tr></thead><tbody>${vs.map(v=>{const x=(c.vagas||{})[v._id]||{};const k=fisCalc(v,UI.fisMes||fisPrevYM());const ln=k.linhas[0]||{vh:0,h:0,V:0};return`<tr><td>${esc((S.clientes.find(y=>y._id===v.cliente)||{}).nome||'')}</td><td><b>${esc(v.nome)}</b></td><td>${inp(`vagas.${v._id}.id`,x.id||'','text',` placeholder="${esc(fisIdVaga(Object.assign({},v,{})))}" style="width:140px;min-width:140px"`)}</td><td class="num">${inp(`vagas.${v._id}.horas`,x.horas||'','num',` placeholder="${esc(String(c.fixos.horasPadrao||168))}" inputmode="numeric" style="width:90px;min-width:90px"`)}</td><td class="small">PROFISSIONAL ${esc(fisIdVaga(v))} - R$ ${nf2.format(ln.vh)} X ${nf0.format(ln.h)} HS = R$ ${nf2.format(ln.V)}</td></tr>`}).join('')||'<tr><td colspan="5" class="empty">Nenhuma vaga ativa.</td></tr>'}</tbody></table></div><div class="pb"><p class="note">Deixe em branco para usar o padrão: o número no fim do nome da vaga (VB 10 vira #10) e as horas padrão. Se a vaga tiver valor hora × horas no cadastro de Contratos, eles são usados; senão, o valor hora é a receita dividida pelas horas. Vagas do mesmo contrato saem na mesma nota, uma linha para cada.</p></div></section>`;
  h+=`<section class="panel"><div class="pb">${fisBarra()}</div></section>`;
  return h}

  '[Alíquota aproximada do total de impostos]',`Federal: ${p(A.aproxFed)}`,`Estadual: ${p(A.aproxEst)}`,`Municipal: ${p(A.aproxMun)}`,`Total: ${p(A.aproxFed+A.aproxEst+A.aproxMun)}`,'',
  '[Outras informações]',F.outrasInfo||'(em branco)','',

function vFisEspelho(){if(!UI.fisMes)UI.fisMes=fisPrevYM();const ym=UI.fisMes;const E=S.canWrite&&P('editar_fiscal');
  const ops=[];{const[y,m]=curYM().split('-').map(Number);for(let i=-1;i<=14;i++){const d=new Date(y,m-1-i,1);ops.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`)}}if(!ops.includes(ym))ops.push(ym);

    const ks=vs.map(u=>[u,fisCalc(u.vagas,ym)]);const tot=ks.reduce((s,[,k])=>({V:s.V+k.V,liq:s.liq+k.liq}),{V:0,liq:0});const emit=vs.filter(v=>fisNota(cl._id,v._id,ym).status==='emitida').length;
    h+=`<section class="panel"><div class="ph"><h2>${esc(cl.nome)} · ${ymLabel(ym)}</h2><span class="sub">${vs.length} ${vs.length===1?'nota':'notas'} · ${emit} ${emit===1?'emitida':'emitidas'} · valor total ${fbrl(tot.V)} · líquido ${fbrl(tot.liq)}</span></div>
    ${!t.cnpj?`<div class="pb"><p class="small" style="margin:0;color:var(--warn)">Cliente sem CNPJ de tomador. Preencha em Controle Operacional > Clientes.</p></div>`:''}

  if(!clis.length)h+=`<section class="panel"><div class="empty">Cadastre um cliente primeiro.</div></section>`;
  return h}

function vagaOptsCli(cid,sel){const vs=vagasDe(cid).filter(v=>v.ativa!==false||v._id===sel);const grp={};const sem=[];vs.forEach(v=>{const k=v.contrato&&ktById(v.contrato);if(k)(grp[k._id]=grp[k._id]||{k,l:[]}).l.push(v);else sem.push(v)});const op=v=>`<option value="${v._id}" ${v._id===sel?'selected':''}>${esc(v.nome)}${v.ativa===false?' (inativa)':''}</option>`;return`<option value="">Sem vaga</option>`+Object.values(grp).sort((a,b)=>String(a.k.nome).localeCompare(b.k.nome,'pt-BR',{numeric:true})).map(g=>`<optgroup label="Contrato ${esc(g.k.nome)}">${g.l.map(op).join('')}</optgroup>`).join('')+(sem.length?`<optgroup label="Sem contrato">${sem.map(op).join('')}</optgroup>`:'')+(sel&&!vagaById(sel)?`<option value="${esc(sel)}" selected>vaga removida</option>`:'')}

      case'sync':{const md=S.meses.find(x=>x._id===id);if(!md||md.status==='fechado')return;const ch=(md.alocacoes||[]).map(x=>{const p=prestById(x.prestador);if(!p)return null;const v=custoCad(p,md.mes),c=+x.custo||0;return Math.abs(v-c)>0.005?{n:x.nome,de:c,para:v,obs:x.obs}:null}).filter(Boolean);if(!ch.length){toast(`Os custos já estão iguais aos salários de ${ymLabel(md.mes)}. Nada a aplicar.`);return}const dif=ch.reduce((s,x)=>s+x.para-x.de,0);m={acao:'syncCustos',d:{id},titulo:`Atualizar salários do cadastro em ${ymLabel(md.mes)}`,msg:`${ch.length} ${ch.length===1?'custo vai mudar':'custos vão mudar'} para o salário cadastrado. O custo total do mês ${dif>=0?'sobe':'cai'} ${brl(Math.abs(dif))}. Se algum valor foi ajustado à mão (dias proporcionais, por exemplo), o ajuste será perdido. Deseja aplicar?`,html:`<div style="max-height:240px;overflow:auto;margin:4px 0 12px;border:1px solid var(--line);border-radius:8px"><table class="t" style="font-size:12.5px"><thead><tr><th>Prestador</th><th class="num">Custo atual</th><th class="num">Salário</th></tr></thead><tbody>${ch.map(x=>`<tr><td>${esc(x.n)}${x.obs?`<div class="small muted">${esc(x.obs)}</div>`:''}</td><td class="num">${num2(x.de)}</td><td class="num">${num2(x.para)}</td></tr>`).join('')}</tbody></table></div>`};break}
      case'cli':{const c=cliById(id);const nv=S.vagas.filter(v=>v.cliente===id).length,np=S.prestadores.filter(p=>p.cliente===id||cliHist(p).some(x=>x.cliente===id)).length,nm=S.meses.filter(x=>x.cliente===id).length;if(nv||np||nm){toast(`${c?c.nome:'Este cliente'} não pode ser removido: tem ${[nv?nv+' '+(nv===1?'vaga':'vagas'):'',np?np+' '+(np===1?'prestador':'prestadores'):'',nm?nm+' '+(nm===1?'mês lançado':'meses lançados'):''].filter(Boolean).join(', ')}. Para tirá-lo de uso, clique em Editar e desmarque Ativo.`);return}m={acao:'delCli',d:{id},titulo:'Remover cliente',msg:`Deseja remover ${c?c.nome:'este cliente'}? Ele não tem vagas, prestadores nem meses lançados.`};break}
      case'vp':{const p=prestById(id);const v=p&&vagaById(p.vaga);m={acao:'vpDel',d:{id},titulo:'Remover da vaga',msg:`Deseja remover ${p?p.nome:'este prestador'} da vaga ${v?v.nome:''}? Ele fica sem vaga no cadastro e nos meses abertos a partir de ${ymLabel(curYM())} em que já estiver lançado. Meses passados e fechados não mudam.`};break}
      case'cc':{const c=ccById(id);const n=S.prestadores.filter(p=>ccSplitP(p).some(x=>x.cc===id)).length;m={acao:'delCC',d:{id},titulo:'Remover centro de custo',msg:`Deseja remover ${c?ccNome(id):'este centro de custo'}?${n?` ${n} ${n===1?'prestador está ligado':'prestadores estão ligados'} a ele e ficarão sem centro de custo.`:''} Se ele já foi usado, prefira desmarcar "Ativo" para manter o histórico.`};break}
      case'ct':{const k=S.contratos.find(x=>x._id===id);const nv=S.vagas.filter(v=>v.contrato===id).length;m={acao:'delContrato',d:{id},titulo:'Remover contrato',msg:nv?`O contrato ${k?k.nome:''} tem ${nv} ${nv===1?'vaga':'vagas'} e não pode ser removido. Tire as vagas do contrato ou desmarque Ativo.`:`Deseja remover o contrato ${k?k.nome:''}? Ele não tem vagas.`};break}
      case'v':{const v=vagaById(id);m={acao:'delVaga',d:{id},titulo:'Excluir vaga',msg:`Deseja excluir a vaga ${v?v.nome:''}? Quem está nela hoje fica sem vaga. Os meses já lançados não mudam.`};break}
    case'a':{const md=S.meses.find(x=>x._id===d.doc);const al=md&&(md.alocacoes||[]).find(x=>x.id===id);m={acao:'delAloc',d:{id:d.doc,a:id},titulo:'Remover prestador do mês',msg:`Deseja remover ${al?al.nome:'este prestador'} de ${md?ymLabel(md.mes):'este mês'}? O custo dele deixa de contar neste mês.`};break}
    case'm':{const md=S.meses.find(x=>x._id===id);const c=md&&cliById(md.cliente);m={acao:'delMes',d:{id},titulo:'Excluir mês',msg:`Deseja excluir ${md?ymLabel(md.mes):'este mês'}${c?' de '+c.nome:''}? Todos os lançamentos do mês serão apagados e não podem ser recuperados.`};break}
    case'u':{const pr=nomeDe(id);m={acao:'delAcesso',d:{id},titulo:'Remover acesso',msg:`Deseja remover o acesso de ${(pr&&pr.name)||'esta pessoa'} ao sistema?`};break}
    case'mk':{const r=S.mercado.find(x=>x._id===id);m={acao:'delMerc',d:{id},titulo:'Excluir faixa de mercado',msg:`Deseja excluir a linha de ${r&&r.cargo?r.cargo:'sem cargo'}${r&&r.area?' ('+r.area+')':''} da tabela de salários de mercado?`};break}
    case'sal':{const p=prestById(a1);const x=p&&salarios(p)[+a2];m={acao:'delSal',d:{id:a1,i:a2},titulo:'Remover salário do histórico',msg:`Deseja remover o salário de ${x?brl(x.valor):''} desde ${x?ymLabel(x.desde):''} do histórico de ${p?p.nome:''}? Os meses já lançados não mudam.`};break}
    case'lst':{const L=listas()[a1]||[];const nomes={areas:'áreas de atuação',cargos:'cargos',senioridades:'senioridades'};m={acao:'delLista',d:{kind:a1,i:a2},titulo:'Remover item da lista',msg:`Deseja remover "${L[+a2]||''}" da lista de ${nomes[a1]||a1}? Quem já tem esse item no cadastro continua com ele.`};break}
    case'bf':{const p=prestD(a1);const x=beneficiosP(p)[+a2]||{};m={acao:'delBenef',d:{id:a1,i:a2},titulo:'Remover benefício',msg:`Deseja remover o benefício ${x.desc?'"'+x.desc+'"':''} de ${p?p.nome:''}? A remoção só é gravada ao clicar em Salvar alterações. Meses passados e fechados não mudam.`};break}
      case'ld':{const p=prestD(a1);const x=lideresP(p)[+a2]||{};m={acao:'delLider',d:{id:a1,i:a2},titulo:'Remover líder',msg:`Deseja remover ${x.nome||'este líder'} da lista de líderes de ${p?p.nome:''}? A remoção só é gravada ao clicar em Salvar alterações.`};break}
      case'pcc':{const p=prestD(a1);const x=p?ccSplitP(p)[+a2]:null;m={acao:'delPCC',d:{id:a1,i:a2},titulo:'Remover centro de custo',msg:`Deseja remover ${x?ccNome(x.cc):'este centro de custo'} de ${p?p.nome:''}? Os meses abertos a partir de ${ymLabel(curYM())} são atualizados; meses passados e fechados não mudam.`};break}
      case'pc':{const p=prestD(a1);const h=p?cliHist(p):[];const x=h[+a2];const c=x&&cliById(x.cliente);m={acao:'delPcli',d:{id:a1,i:a2},titulo:'Remover registro de cliente',msg:`Deseja remover o registro de ${c?c.nome:'cliente'} do histórico de ${p?p.nome:''}?`};break}
    case'sol':{const pr=nomeDe(id);m={acao:'recusar',d:{id},titulo:'Recusar pedido de acesso',msg:`Deseja recusar o pedido de acesso de ${(pr&&pr.name)||'esta pessoa'}?`};break}
  }
  if(!m)return;UI.modal=m;UI.modalVolta=document.activeElement;{const tp=document.getElementById('tip');if(tp)tp.hidden=true}const el=document.getElementById('modal');
  el.innerHTML=`<div class="mback" data-click="modalNao"></div><div class="mbox" role="alertdialog" aria-modal="true" aria-labelledby="m-t" aria-describedby="m-d"><h2 id="m-t">${esc(m.titulo)}</h2><p id="m-d">${esc(m.msg)}</p>${m.html||''}<div class="mbtns"><button class="btn" id="m-nao" data-click="modalNao">Não</button><button class="btn mdanger" id="m-sim" data-click="modalSim">Sim</button></div></div>`;
  el.hidden=false;document.getElementById('m-nao').focus()}
function fecharModal(){UI.modal=null;const el=document.getElementById('modal');el.hidden=true;el.innerHTML='';try{UI.modalVolta&&UI.modalVolta.focus&&UI.modalVolta.focus({preventScroll:true})}catch(e){}}
document.addEventListener('keydown',e=>{if(!UI.modal)return;if(e.key==='Escape'){e.preventDefault();fecharModal()}else if(e.key==='Tab'){const a=document.getElementById('m-nao'),b=document.getElementById('m-sim');if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus()}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus()}}});

/* ---------- convites por e-mail ---------- */
const URL_SISTEMA=location.origin;
const convKey=em=>'e_'+String(em).toLowerCase().replace(/[^a-z0-9]+/g,'_');
function convTexto(c){return`Olá!\n\nVocê foi convidado(a) para acessar o sistema Gestão de Prestadores da Nova ITX com o perfil ${PERFIL_NOME[c.perfil]||c.perfil}.\n\nAcesse pelo link:\n${URL_SISTEMA}\n\nEntre com a sua conta Microsoft da Nova ITX usando este e-mail (${c.email}). O seu acesso é liberado automaticamente no primeiro acesso.\n\nQualquer dúvida, é só responder esta mensagem.`}
function convMailto(c){return'mailto:'+encodeURIComponent(c.email)+'?subject='+encodeURIComponent('Convite: Gestão de Prestadores Nova ITX')+'&body='+encodeURIComponent(convTexto(c))}
function aplicarConvites(){if(!S.convLoaded||!S.loaded.acessos||!S.loaded.solicitacoes||!S.canWrite||!S.me||!S.me.canEdit||!P('gerenciar_acessos'))return;S.convFeitos=S.convFeitos||{};
  for(const s of S.solicitacoes){const em=String(s.email||'').toLowerCase();if(!em||S.convFeitos[s._id]||S.acessos.some(a=>a._id===s._id))continue;const c=(S.convites||[]).find(x=>!x.aceitoEm&&String(x.email||'').toLowerCase()===em);if(!c||!PERFIL_NOME[c.perfil])continue;S.convFeitos[s._id]=true;
    patch('acessos',s._id,o=>Object.assign(o,{perfil:c.perfil,desde:new Date().toISOString(),por:c.por||S.me.id,convite:em}),true);patch('convites',c._id,o=>{o.aceitoEm=new Date().toISOString();o.usuario=s._id});remove('solicitacoes',s._id);toast(`Convite aceito: ${em} entrou como ${PERFIL_NOME[c.perfil]}.`)}}

/* ---------- conexão ---------- */
function pedirAcesso(){if(S.reqSent||!S.db||!S.me||!S.me.id||!S.loaded.acessos)return;S.reqSent=true;
  S.db.doc('solicitacoes/'+S.me.id).set(Object.assign({pedidoEm:new Date().toISOString()},S.me.email?{email:String(S.me.email).toLowerCase()}:{})).then(()=>{S.reqOk=true;render()}).catch(()=>{})}
function registrarDono(){if(!S.me||!S.me.isOwner||!S.me.id||!S.loaded.acessos||S.donoOk)return;S.donoOk=true;const a=S.acessos.find(x=>x._id===S.me.id);if(!a||a.perfil!=='admin'||!a.dono)S.db.doc('acessos/'+S.me.id).set({perfil:'admin',dono:true,desde:(a&&a.desde)||new Date().toISOString()}).catch(()=>{})}
async function start(){
  render();
  let db=null;try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(!db){S.dbState='none';render();return}
  S.db=db;S.dbState='ok';
  try{const user=await window.claude.use('user');S.user=user;if(user){const c=await user.can('data.write');if(c===false)S.canWrite=false;S.me=await user.me()}}catch(e){}
  S.loaded.me=true;
  const onErr=e=>{if(e&&e.code==='revoked'){S.dbState='none';render()}else console.warn(e)};
  const coll=name=>db.collection(name).onSnapshot(snap=>{S[name]=snap.docs.map(d=>Object.assign({_id:d.id},d.data()));if(name==='prestadores'&&UI.novos)for(const id in UI.novos){if(S.prestadores.some(p=>p._id===id))delete UI.novos[id];else S.prestadores.push(UI.novos[id])}S.loaded[name]=true;if(name==='acessos')registrarDono();if(name==='acessos'||name==='solicitacoes')aplicarConvites();render()},onErr);
  db.doc('config/listas').onSnapshot(d=>{S.listas=d.exists?Object.assign({},d.data()):null;AUD.srv['config/listas']=clone(S.listas);S.loaded.config=true;render()},onErr);
  db.doc('config/sistema').onSnapshot(d=>{S.sis=d.exists?Object.assign({},d.data()):null;AUD.srv['config/sistema']=clone(S.sis);S.loaded.sistema=true;render()},onErr);
  ['clientes','vagas','prestadores','meses','acessos','solicitacoes','mercado','centros','notas','contratos','mesnotas'].forEach(coll);
  db.doc('config/fiscal').onSnapshot(d=>{S.fiscal=d.exists?Object.assign({},d.data()):null;AUD.srv['config/fiscal']=clone(S.fiscal);S.loaded.fiscal=true;render()},onErr);
  db.doc('config/mercado').onSnapshot(d=>{S.mercInfo=d.exists?Object.assign({},d.data()):null;S.loaded.mercInfo=true;render()},onErr);
  db.doc('relconfig/acesso').onSnapshot(d=>{S.relcfg=d.exists?Object.assign({},d.data()):null;AUD.srv['relconfig/acesso']=clone(S.relcfg);S.loaded.relcfg=true;render()},onErr);
  coll('relnotas');
  try{db.collection('convites').onSnapshot(snap=>{S.convites=snap.docs.map(d=>Object.assign({_id:d.id},d.data()));S.convLoaded=true;aplicarConvites();render()},()=>{S.convLoaded=false})}catch(e){}
  db.doc('perfis/menus').onSnapshot(d=>{S.menus=d.exists?Object.assign({},d.data()):{};render()},onErr);
  db.doc('perfis/matriz').onSnapshot(d=>{S.matriz=d.exists?Object.assign({},d.data()):null;AUD.srv['perfis/matriz']=clone(S.matriz);S.loaded.perfis=true;render()},onErr);
}
start();
})();
